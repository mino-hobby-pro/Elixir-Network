<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elixir-Network</title>
    <link rel="icon" type="image/x-icon" href="/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #050508;
            --elixir-primary: #8b5cf6;
            --elixir-secondary: #06b6d4;
            --tab-active: #1a1a25;
            --tab-inactive: #0f0f15;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(139, 92, 246, 0.2);
            --accent-gradient: linear-gradient(135deg, #8b5cf6 0%, #06b6d4 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- Loading Animation --- */
        #splash-screen {
            position: fixed;
            inset: 0;
            background: var(--bg-dark);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .splash-logo {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: -1px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 20px rgba(139, 92, 246, 0.4));
            animation: logo-emerge 1.5s ease-out forwards;
        }

        .loader-bar {
            width: 200px;
            height: 2px;
            background: rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
            border-radius: 4px;
        }

        .loader-progress {
            position: absolute;
            height: 100%;
            width: 0;
            background: var(--accent-gradient);
            animation: load-progress 2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes logo-emerge {
            0% { opacity: 0; transform: scale(0.9) translateY(20px); filter: blur(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
        }

        @keyframes load-progress {
            0% { width: 0; }
            100% { width: 100%; }
        }

        /* --- Background --- */
        #particles-js {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }

        /* --- Browser UI Layout --- */
        .browser-root {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* --- Tab System (Google Style) --- */
        .tab-strip {
            display: flex;
            align-items: flex-end;
            background: #000;
            padding: 8px 12px 0;
            height: 44px;
            gap: 4px;
        }

        .tab {
            position: relative;
            height: 34px;
            min-width: 140px;
            max-width: 200px;
            background: var(--tab-inactive);
            border-radius: 8px 8px 0 0;
            display: flex;
            align-items: center;
            padding: 0 12px;
            cursor: pointer;
            transition: background 0.2s, width 0.3s;
            user-select: none;
        }

        .tab.active {
            background: var(--tab-active);
            z-index: 2;
        }

        .tab-title {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-grow: 1;
            margin-right: 8px;
        }

        .tab.active .tab-title { color: var(--text-main); }

        .tab-close {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            transition: 0.2s;
        }

        .tab-close:hover { background: rgba(255,255,255,0.1); color: #ff5f57; }

        .new-tab-btn {
            width: 28px;
            height: 28px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            color: var(--text-muted);
            transition: 0.2s;
        }

        .new-tab-btn:hover { background: rgba(255,255,255,0.1); color: var(--text-main); }

        /* --- URL Bar / Controls --- */
        .toolbar {
            background: var(--tab-active);
            height: 48px;
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .nav-icons { display: flex; gap: 4px; }
        .nav-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-muted);
            transition: 0.2s;
        }
        .nav-btn:hover { background: rgba(255,255,255,0.1); color: var(--text-main); }

        .address-bar-container {
            flex-grow: 1;
            max-width: 900px;
            position: relative;
        }

        .address-bar {
            width: 100%;
            height: 32px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 0 40px;
            color: var(--text-main);
            font-size: 13px;
            outline: none;
            transition: border-color 0.3s;
        }

        .address-bar:focus { border-color: var(--elixir-primary); background: rgba(0,0,0,0.6); }

        .addr-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 12px; color: var(--text-muted); }

        /* --- Viewport & Start Page --- */
        .content-area {
            flex-grow: 1;
            position: relative;
            background: var(--bg-dark);
        }

        .viewport-frame {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: none;
            background: white;
        }

        .viewport-frame.active { display: block; }

        /* --- The Ultimate Start Page --- */
        .start-page {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 5;
            padding-bottom: 10vh;
        }

        .hero-logo {
            font-size: 5rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 40px;
            filter: drop-shadow(0 0 30px rgba(139, 92, 246, 0.3));
            user-select: none;
            cursor: default;
        }

        .search-box-wrapper {
            width: 100%;
            max-width: 600px;
            position: relative;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .search-box-wrapper:focus-within { transform: scale(1.02); }

        .search-box {
            width: 100%;
            height: 54px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 0 60px;
            color: #fff;
            font-size: 1.1rem;
            outline: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            transition: all 0.3s;
        }

        .search-box:hover, .search-box:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--elixir-primary);
            box-shadow: 0 8px 32px rgba(139, 92, 246, 0.2);
        }

        .search-icon-main { position: absolute; left: 22px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 18px; }
        .search-shortcut { position: absolute; right: 22px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 18px; }

        .quick-links {
            margin-top: 30px;
            display: flex;
            gap: 20px;
        }

        .link-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.2s;
            width: 80px;
        }

        .link-icon {
            width: 48px;
            height: 48px;
            background: rgba(255,255,255,0.05);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: 0.3s;
        }

        .link-item:hover .link-icon { background: var(--elixir-primary); transform: translateY(-5px); color: white; }
        .link-item span { font-size: 12px; color: var(--text-muted); }
    </style>
</head>
<body>

    <!-- Splash Screen -->
    <div id="splash-screen">
        <div class="splash-logo">ELIXIR</div>
        <div class="loader-bar">
            <div class="loader-progress"></div>
        </div>
    </div>

    <!-- Background Particles -->
    <div id="particles-js"></div>

    <div class="browser-root">
        <!-- Tab Strip -->
        <div class="tab-strip" id="tab-strip">
            <!-- Tabs injected here -->
            <div class="new-tab-btn" onclick="createNewTab()">
                <i class="fa-solid fa-plus"></i>
            </div>
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
            <div class="nav-icons">
                <div class="nav-btn" onclick="goBack()"><i class="fa-solid fa-arrow-left"></i></div>
                <div class="nav-btn" onclick="goForward()"><i class="fa-solid fa-arrow-right"></i></div>
                <div class="nav-btn" onclick="reloadTab()"><i class="fa-solid fa-rotate-right"></i></div>
            </div>
            <div class="address-bar-container">
                <i class="fa-solid fa-lock addr-icon"></i>
                <input type="text" id="address-bar" class="address-bar" placeholder="Search or enter URL">
            </div>
        </div>

        <!-- Content -->
        <div class="content-area" id="content-area">
            <!-- Start Page (Only visible when no URL loaded) -->
            <div class="start-page" id="start-page">
                <div class="hero-logo">ELIXIR</div>
                <div class="search-box-wrapper">
                    <i class="fa-solid fa-magnifying-glass search-icon-main"></i>
                    <input type="text" id="main-search" class="search-box" placeholder="Search with Elixir Intelligence...">
                    <i class="fa-solid fa-microphone search-shortcut"></i>
                </div>
                <div class="quick-links">
                    <div class="link-item" onclick="quickNav('google.com')">
                        <div class="link-icon"><i class="fa-brands fa-google"></i></div>
                        <span>Google</span>
                    </div>
                    <div class="link-item" onclick="quickNav('youtube.com')">
                        <div class="link-icon"><i class="fa-brands fa-youtube"></i></div>
                        <span>YouTube</span>
                    </div>
                    <div class="link-item" onclick="quickNav('discord.com')">
                        <div class="link-icon"><i class="fa-brands fa-discord"></i></div>
                        <span>Discord</span>
                    </div>
                    <div class="link-item" onclick="quickNav('github.com')">
                        <div class="link-icon"><i class="fa-brands fa-github"></i></div>
                        <span>GitHub</span>
                    </div>
                </div>
            </div>
            <!-- iFrames injected here -->
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        // --- 1. State Management ---
        let tabs = [];
        let activeTabId = null;
        let tabIdCounter = 0;

        // --- 2. Initial Setup ---
        window.onload = () => {
            // Particle JS
            particlesJS('particles-js', {
                particles: {
                    number: { value: 60 },
                    color: { value: '#8b5cf6' },
                    opacity: { value: 0.2 },
                    size: { value: 2 },
                    line_linked: { enable: true, distance: 150, color: '#8b5cf6', opacity: 0.1, width: 1 },
                    move: { speed: 1 }
                }
            });

            // Hide Splash
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => splash.remove(), 800);
            }, 2200);

            createNewTab();
        };

        // --- 3. Core Functions ---

        function createNewTab() {
            const id = `tab-${tabIdCounter++}`;
            const tabObj = {
                id: id,
                url: null,
                title: 'New Tab',
                frame: null
            };

            // Create Tab Element
            const tabEl = document.createElement('div');
            tabEl.className = 'tab';
            tabEl.id = `el-${id}`;
            tabEl.innerHTML = `
                <div class="tab-title">${tabObj.title}</div>
                <div class="tab-close" onclick="closeTab(event, '${id}')"><i class="fa-solid fa-xmark"></i></div>
            `;
            tabEl.onclick = () => switchTab(id);
            
            document.getElementById('tab-strip').insertBefore(tabEl, document.querySelector('.new-tab-btn'));

            // Create iFrame
            const iframe = document.createElement('iframe');
            iframe.className = 'viewport-frame';
            iframe.id = `iframe-${id}`;
            document.getElementById('content-area').appendChild(iframe);
            tabObj.frame = iframe;

            tabs.push(tabObj);
            switchTab(id);
        }

        function switchTab(id) {
            activeTabId = id;
            const currentTab = tabs.find(t => t.id === id);

            // UI Classes
            document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
            document.getElementById(`el-${id}`).classList.add('active');

            document.querySelectorAll('.viewport-frame').forEach(el => el.classList.remove('active'));
            
            const startPage = document.getElementById('start-page');
            const addressBar = document.getElementById('address-bar');

            if (currentTab.url) {
                startPage.style.display = 'none';
                currentTab.frame.classList.add('active');
                addressBar.value = currentTab.url;
            } else {
                startPage.style.display = 'flex';
                addressBar.value = '';
            }
        }

        function closeTab(event, id) {
            event.stopPropagation();
            if (tabs.length === 1) return; // Don't close last tab

            const index = tabs.findIndex(t => t.id === id);
            const tabObj = tabs[index];

            tabObj.frame.remove();
            document.getElementById(`el-${id}`).remove();
            tabs.splice(index, 1);

            if (activeTabId === id) {
                const nextTab = tabs[index] || tabs[index - 1];
                switchTab(nextTab.id);
            }
        }

        function navigate(input) {
            if (!activeTabId || !input.trim()) return;
            
            let url = input.trim();
            const isUrl = /^(https?:\/\/)?([\w.-]+)\.([a-z]{2,})(:\d{1,5})?(\/.*)?$/i.test(url) && !url.includes(' ');

            if (!isUrl) {
                url = `https://www.startpage.com/sp/search?query=${encodeURIComponent(url)}`;
            } else if (!/^https?:\/\//i.test(url)) {
                url = 'https://' + url;
            }

            const currentTab = tabs.find(t => t.id === activeTabId);
            currentTab.url = url;
            
            // Generate Proxy Encoded URL (Placeholder for your UV or local Proxy)
            // Example: currentTab.frame.src = __uv$config.prefix + __uv$config.encodeUrl(url);
            currentTab.frame.src = url; // 直接埋め込み (実際はここでProxy URLに変換)

            // Update Tab Title
            try {
                const domain = new URL(url).hostname.replace('www.', '');
                document.querySelector(`#el-${activeTabId} .tab-title`).textContent = domain;
            } catch {
                document.querySelector(`#el-${activeTabId} .tab-title`).textContent = url;
            }

            switchTab(activeTabId);
        }

        // --- 4. Listeners ---

        document.getElementById('address-bar').onkeydown = (e) => {
            if (e.key === 'Enter') navigate(e.target.value);
        };

        document.getElementById('main-search').onkeydown = (e) => {
            if (e.key === 'Enter') navigate(e.target.value);
        };

        function quickNav(target) {
            navigate(target);
        }

        function reloadTab() {
            const currentTab = tabs.find(t => t.id === activeTabId);
            if (currentTab && currentTab.url) currentTab.frame.src = currentTab.frame.src;
        }

        function goBack() {
            const currentTab = tabs.find(t => t.id === activeTabId);
            if (currentTab) currentTab.frame.contentWindow.history.back();
        }

        function goForward() {
            const currentTab = tabs.find(t => t.id === activeTabId);
            if (currentTab) currentTab.frame.contentWindow.history.forward();
        }
    </script>
</body>
</html>
