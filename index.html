<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elixir Network | Search & Proxy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Zen+Dot&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-black: #050507;
            --elixir-purple: #8b5cf6;
            --elixir-cyan: #06b6d4;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(139, 92, 246, 0.2);
            --text-main: #e5e7eb;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-black);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- Loading Intro Animation --- */
        #intro-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg-black);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 1s ease, visibility 1s;
        }

        .intro-logo {
            font-family: 'Zen Dot', cursive;
            font-size: 4rem;
            background: linear-gradient(to right, var(--elixir-purple), var(--elixir-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0;
            transform: scale(0.8);
            animation: intro-reveal 2.5s forwards;
        }

        .intro-loader {
            width: 200px;
            height: 2px;
            background: rgba(255,255,255,0.1);
            margin-top: 20px;
            position: relative;
            overflow: hidden;
        }

        .intro-loader::after {
            content: '';
            position: absolute;
            width: 40%;
            height: 100%;
            background: var(--elixir-cyan);
            animation: loader-slide 2s infinite ease-in-out;
        }

        @keyframes intro-reveal {
            0% { opacity: 0; transform: scale(0.8) blur(10px); }
            50% { opacity: 1; transform: scale(1) blur(0px); text-shadow: 0 0 20px rgba(139, 92, 246, 0.5); }
            100% { opacity: 0; transform: scale(1.1) blur(5px); }
        }

        @keyframes loader-slide {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        /* --- Background --- */
        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, #110e1a 0%, #050507 100%);
        }

        /* --- Start Page Layout --- */
        .start-page {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 10;
        }

        .start-page.minimized {
            transform: translateY(-120%);
            opacity: 0;
            pointer-events: none;
        }

        .brand-huge {
            font-family: 'Zen Dot', cursive;
            font-size: clamp(3rem, 10vw, 6rem);
            background: linear-gradient(135deg, var(--elixir-purple), var(--elixir-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 40px;
            letter-spacing: -2px;
            filter: drop-shadow(0 0 30px rgba(139, 92, 246, 0.3));
            animation: float 6s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* --- Google Style Search Bar --- */
        .search-container {
            width: 100%;
            max-width: 650px;
            padding: 0 20px;
        }

        .search-wrapper {
            position: relative;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .search-wrapper:hover, .search-wrapper:focus-within {
            background: rgba(255, 255, 255, 0.07);
            border-color: var(--elixir-cyan);
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.2);
        }

        .search-wrapper i {
            color: var(--text-muted);
            margin-right: 15px;
            font-size: 1.2rem;
        }

        .main-input {
            background: none;
            border: none;
            outline: none;
            color: white;
            width: 100%;
            font-size: 1.1rem;
            font-weight: 400;
        }

        /* --- Browser UI (Hidden by default) --- */
        .browser-ui {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 20;
            background: var(--bg-black);
        }

        .browser-ui.active {
            transform: translateY(0);
        }

        .top-bar {
            background: rgba(10, 10, 15, 0.95);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 8px 16px;
            gap: 15px;
        }

        .mini-logo {
            font-family: 'Zen Dot', cursive;
            font-size: 1.1rem;
            background: linear-gradient(to right, var(--elixir-purple), var(--elixir-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
        }

        /* --- Tab System --- */
        .tabs-wrapper {
            display: flex;
            overflow-x: auto;
            flex: 1;
            scrollbar-width: none;
            gap: 5px;
        }

        .tab {
            min-width: 140px;
            max-width: 200px;
            height: 34px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px 8px 0 0;
            display: flex;
            align-items: center;
            padding: 0 12px;
            font-size: 0.85rem;
            cursor: pointer;
            border: 1px solid transparent;
            position: relative;
        }

        .tab.active {
            background: var(--bg-black);
            border: 1px solid var(--border);
            border-bottom: none;
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -1px; left: 0; width: 100%; height: 2px;
            background: var(--bg-black);
            z-index: 5;
        }

        .tab-close {
            margin-left: auto;
            opacity: 0.5;
            transition: 0.2s;
        }
        .tab-close:hover { opacity: 1; color: #ff4d4f; }

        /* --- Viewport --- */
        .content-area {
            flex: 1;
            position: relative;
            background: white;
        }

        iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }

        iframe.active { display: block; }

        /* --- Control Buttons --- */
        .nav-controls { display: flex; gap: 8px; }
        .control-btn {
            background: none;
            border: none;
            color: var(--text-main);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            transition: 0.2s;
        }
        .control-btn:hover { background: rgba(255,255,255,0.1); }

    </style>
</head>
<body>

    <!-- Intro Animation -->
    <div id="intro-overlay">
        <div class="intro-logo">ELIXIR</div>
        <div class="intro-loader"></div>
    </div>

    <!-- Animated Background -->
    <div id="canvas-container">
        <div id="particles-js"></div>
    </div>

    <!-- Start Page -->
    <main class="start-page" id="start-page">
        <div class="brand-huge">ELIXIR</div>
        <div class="search-container">
            <div class="search-wrapper">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" class="main-input" id="search-input" placeholder="Search the web or enter URL..." autocomplete="off">
            </div>
        </div>
    </main>

    <!-- Browser Interface -->
    <div class="browser-ui" id="browser-ui">
        <div class="top-bar">
            <div class="mini-logo" onclick="goHome()">ELIXIR</div>
            
            <div class="nav-controls">
                <button class="control-btn" onclick="back()"><i class="fa-solid fa-chevron-left"></i></button>
                <button class="control-btn" onclick="forward()"><i class="fa-solid fa-chevron-right"></i></button>
                <button class="control-btn" onclick="reload()"><i class="fa-solid fa-rotate-right"></i></button>
            </div>

            <div class="tabs-wrapper" id="tabs-container">
                <!-- Tabs injected here -->
            </div>

            <button class="control-btn" onclick="createNewTab()" style="margin-right: 10px;">
                <i class="fa-solid fa-plus"></i>
            </button>

            <div class="search-wrapper" style="max-width: 400px; padding: 6px 16px; border-radius: 10px; flex: 1;">
                <input type="text" id="omni-input" class="main-input" style="font-size: 0.9rem;">
            </div>
        </div>

        <div class="content-area" id="viewport">
            <!-- Iframes injected here -->
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        // 1. Initial Intro Animation
        window.addEventListener('load', () => {
            setTimeout(() => {
                const overlay = document.getElementById('intro-overlay');
                overlay.style.opacity = '0';
                setTimeout(() => overlay.style.visibility = 'hidden', 1000);
            }, 2500);
        });

        // 2. Background Particles
        particlesJS('particles-js', {
            particles: {
                number: { value: 60, density: { enable: true, value_area: 800 } },
                color: { value: "#8b5cf6" },
                shape: { type: "circle" },
                opacity: { value: 0.2, random: true },
                size: { value: 2, random: true },
                line_linked: { enable: true, distance: 150, color: "#8b5cf6", opacity: 0.1, width: 1 },
                move: { enable: true, speed: 1 }
            }
        });

        // 3. Browser Engine
        let tabs = [];
        let activeTabId = null;

        const startPage = document.getElementById('start-page');
        const browserUi = document.getElementById('browser-ui');
        const searchInput = document.getElementById('search-input');
        const omniInput = document.getElementById('omni-input');
        const tabsContainer = document.getElementById('tabs-container');
        const viewport = document.getElementById('viewport');

        function processInput(input) {
            let val = input.trim();
            if (!val) return null;
            const isUrl = /^(https?:\/\/)?([\w.-]+)\.([a-z]{2,})(:\d{1,5})?(\/.*)?$/i.test(val) && !val.includes(' ');
            return isUrl ? (val.startsWith('http') ? val : 'https://' + val) : `https://www.startpage.com/sp/search?query=${encodeURIComponent(val)}`;
        }

        // 404防止用のURL生成（現在のパスを考慮）
        function getProxyUrl(target) {
            const path = window.location.pathname;
            const base = path.substring(0, path.lastIndexOf('/') + 1);
            return `${base}embed#${encodeURIComponent(target)}`;
        }

        function createNewTab(url = null) {
            const id = 'tab-' + Date.now();
            const tabEl = document.createElement('div');
            tabEl.className = 'tab';
            tabEl.id = 'trigger-' + id;
            tabEl.innerHTML = `
                <span class="tab-txt">New Tab</span>
                <i class="fa-solid fa-xmark tab-close" onclick="closeTab(event, '${id}')"></i>
            `;
            tabEl.onclick = () => switchTab(id);
            tabsContainer.appendChild(tabEl);

            const iframe = document.createElement('iframe');
            iframe.id = 'frame-' + id;
            viewport.appendChild(iframe);

            const tabObj = { id, el: tabEl, frame: iframe, url: url };
            tabs.push(tabObj);

            if (url) {
                iframe.src = getProxyUrl(url);
                tabEl.querySelector('.tab-txt').textContent = url.split('/')[2] || url;
            }

            switchTab(id);
            
            // 初めてのタブ作成時にUIを表示
            startPage.classList.add('minimized');
            browserUi.classList.add('active');
        }

        function switchTab(id) {
            activeTabId = id;
            tabs.forEach(t => {
                const isActive = t.id === id;
                t.el.classList.toggle('active', isActive);
                t.frame.classList.toggle('active', isActive);
                if (isActive) omniInput.value = t.url || '';
            });
        }

        function closeTab(e, id) {
            e.stopPropagation();
            const index = tabs.findIndex(t => t.id === id);
            if (index === -1) return;

            tabs[index].el.remove();
            tabs[index].frame.remove();
            tabs.splice(index, 1);

            if (tabs.length === 0) {
                goHome();
            } else if (activeTabId === id) {
                switchTab(tabs[Math.max(0, index - 1)].id);
            }
        }

        function goHome() {
            startPage.classList.remove('minimized');
            browserUi.classList.remove('active');
            tabs.forEach(t => { t.el.remove(); t.frame.remove(); });
            tabs = [];
            activeTabId = null;
            searchInput.value = '';
            searchInput.focus();
        }

        // Input Handlers
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const url = processInput(searchInput.value);
                if (url) createNewTab(url);
            }
        });

        omniInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const url = processInput(omniInput.value);
                const tab = tabs.find(t => t.id === activeTabId);
                if (tab && url) {
                    tab.url = url;
                    tab.frame.src = getProxyUrl(url);
                    tab.el.querySelector('.tab-txt').textContent = url.split('/')[2] || "Loading...";
                }
            }
        });

        // Controls
        function reload() {
            const tab = tabs.find(t => t.id === activeTabId);
            if (tab) tab.frame.src = tab.frame.src;
        }
        function back() {
            const tab = tabs.find(t => t.id === activeTabId);
            try { tab.frame.contentWindow.history.back(); } catch(e) {}
        }
        function forward() {
            const tab = tabs.find(t => t.id === activeTabId);
            try { tab.frame.contentWindow.history.forward(); } catch(e) {}
        }

        // Focus start
        setTimeout(() => searchInput.focus(), 3000);

    </script>
</body>
</html>
